server.port=8080
spring.application.name=excel-import-app

# Oracle datasource
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCL
spring.datasource.username=SYSTEM
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=oracle-hikari-pool

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.default_schema=SYSTEM

# Storage
app.import.storage-dir=/var/imports
app.import.lock-key=EXCEL_IMPORT_LOCK
app.import.lease-seconds=30
app.import.refresh-ms=2000
app.import.max-workers=4
app.import.max-queue=32
app.import.allowed-extension=.xlsx

# GWT
gwt.module=com.example.importapp.ImportApp
